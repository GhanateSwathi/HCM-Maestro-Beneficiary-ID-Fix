# stopped.
- extendedWaitUntil:
    visible: "Registration & Delivery"
    timeout: 15000
    label: "Part 01 left the app on the home screen"
- runFlow:
    file: ../../subflows/cases/d11-kill.yaml
    env:
      R: 1
