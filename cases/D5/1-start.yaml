appId: ${HCM_APP_ID}
name: D5 part 1 - device 1 signs in and downloads IDs
tags:
  - phase-a
---
# Test plan D5 - same CDD, two devices, neither synced - run in lockstep
# (QA's decision, 2026-11-03): both emulators do each step at the same time,
# signed in as the same CDD. Parts with the same number run together
# (run-case.ps1); parts "@2" run on device 2 (DEVICE_ID_2).
#   1  both sign in. No new download: Download Beneficiary IDs was greyed
#      out on emulator-5554 at 598 of 600 (2026-11-03 12:30), so both use
#      the pool each re-fetched in X9 at 12:09
#   2  both go into airplane mode; device 1 registers QAID-D5-A, device 2
#      QAID-D5-B
#   3  A and B compared; both back online and Sync Data
#
# Expected: A != B. If A = B, the phone-side fix cannot catch it - each
# device sees only its own data - and in Phase A the duplicate reaches the
# server: report.py fails the case on the duplicate ID, which is that gap
# (only the server setting of Phase C can stop it). The plan's server search
# is not done (no server access).
#
# Two identical emulators (scripts/start-emulator.ps1). VARs: N0, N0_2,
# D5_ID_A, D5_ID_B. Writes two households to UAT - with the same ID if the
# gap is there (synced as the plan says, by the tester's decision).
- runFlow:
    file: ../../subflows/id/case-start.yaml
    env:
      NEED: 1
# The note is the same on every build (D5-122 runs this too): the 2.2.120
# date is the reason, not something this run saw.
- evalScript: "${console.log('NOTE|No new ID download in D5 - both devices used the pool each downloaded in the X9 run before it (on 2.2.120 Download Beneficiary IDs was greyed out at 598 of 600, 2026-11-03 12:30)')}"
