appId: ${HCM_APP_ID}
name: D5 part 3 - device 1 offline, registers A
tags:
  - phase-a
---
# D5 part 3 (see 1-start.yaml), device 1, from the home screen: airplane mode
# on -> QAID-D5-A. Ends on the home screen, still offline.
- extendedWaitUntil:
    visible: "Registration & Delivery"
    timeout: 15000
    label: "Part 1 left device 1 on the home screen"
- setAirplaneMode: enabled
- runFlow: ../../subflows/registration/open-search.yaml
- runFlow:
    file: ../../subflows/registration/register-and-read.yaml
    env:
      NAME: QAID-D5-A
      KEY: D5_ID_A
- runFlow: ../../subflows/common/go-home.yaml
