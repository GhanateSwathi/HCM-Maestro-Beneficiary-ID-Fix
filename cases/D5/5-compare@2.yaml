appId: ${HCM_APP_ID}
name: D5 part 5 - compare A and B, device 2 still offline
tags:
  - phase-a
---
# D5 part 5 (see 1-start.yaml), device 2, from the home screen.
- extendedWaitUntil:
    visible: "Registration & Delivery"
    timeout: 15000
    label: "Part 4 left device 2 on the home screen"
- runScript:
    file: ../../subflows/id/id.js
    env:
      ACTION: check
      OK: ${String(D5_ID_A) != String(D5_ID_B) && String(D5_ID_B).length == 12 && !/\D/.test(D5_ID_B)}
      TEXT: "${String(D5_ID_A) == String(D5_ID_B) ? 'A and B got the SAME ID ' + D5_ID_A + ' on two devices of one CDD, both offline - the phone-side fix cannot see the other device; only the server setting (Phase C) can stop it' : 'A and B, registered offline on two devices of one CDD, have different IDs - A ' + D5_ID_A + ', B ' + D5_ID_B}"
- runFlow: ../../subflows/id/read-available.yaml
- runScript:
    file: ../../subflows/id/id.js
    env:
      ACTION: note
      TEXT: "${'Device 2 N available ' + N0_2 + ' before B, ' + output.id.available + ' after; device 1 started at ' + N0}"
