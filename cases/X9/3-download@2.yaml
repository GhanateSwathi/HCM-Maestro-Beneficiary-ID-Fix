appId: ${HCM_APP_ID}
name: X9 part 3 - device 2 signs in as the same CDD and downloads IDs
tags:
  - phase-a
---
# X9 part 3 (see 1-start.yaml), device 2: sign in as the same CDD -> home ->
# Download Beneficiary IDs (Re-Fetch IDs on "Limit exceeded") -> N available
# as VAR N0_2. Ends on device 2's home screen.
- runFlow:
    file: ../../subflows/id/case-start.yaml
    env:
      NEED: 1
      DOWNLOAD: "yes"
      N_VAR: N0_2
      T_VAR: T0_2
