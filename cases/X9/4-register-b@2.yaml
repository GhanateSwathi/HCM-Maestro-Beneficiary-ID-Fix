appId: ${HCM_APP_ID}
name: X9 part 4 - device 2 registers B and syncs
tags:
  - phase-a
---
# X9 part 4 (see 1-start.yaml), device 2, from the home screen. Ends on the
# home screen with B synced.
- extendedWaitUntil:
    visible: "Registration & Delivery"
    timeout: 15000
    label: "Part 3 left device 2 on the home screen"
- runFlow: ../../subflows/registration/open-search.yaml
- runFlow:
    file: ../../subflows/registration/register-and-read.yaml
    env:
      NAME: QAID-X9-B
      KEY: X9_ID_B
- runFlow: ../../subflows/common/go-home.yaml
- runFlow: ../../subflows/common/sync-data.yaml
