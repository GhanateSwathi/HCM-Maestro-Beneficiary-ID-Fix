appId: ${HCM_APP_ID}
name: reg-location-consent
---
# From Household Location: wait for the location fix -> Next -> Care giver's
# consent Yes -> Submit. Ends on Household Details (the member count).
#
# Kebbi 2.2.122 (form "version 3", 2026-11-03) names the page Beneficiary
# Location, the field "Lat/Long *" and the button Save Location; the
# consent page is the same.
- extendedWaitUntil:
    visible:
      text: "\\d+(\\.\\d+)? meters"
      below: "Geo-coordinates \\*|Lat/Long \\*"
    timeout: 60000
    label: "The location is captured"
- tapOn:
    text: "Next|Save Location"
    label: "Next"
- extendedWaitUntil:
    visible: "Care giver's consent"
    timeout: 15000
    label: "Care giver's consent opens"
- tapOn:
    leftOf: "Yes"
    below: "Did the care giver allow.*"
    above: "No"
    label: "Consent - Yes"
- tapOn:
    text: "Submit"
    below: "Care giver's consent"
    label: "Submit the consent"
- extendedWaitUntil:
    visible: "Total household members \\*"
    timeout: 15000
    label: "Household Details opens"
